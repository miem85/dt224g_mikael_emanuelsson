            <h2>Kontaktformulär</h2>
            <p>Vill du kontakta mig? Fyll i formuläret nedan så hör jag av mig så snart som möjligt.<br>Du kan också nå mig direkt via e-post: <a href="mailto:miem2600@student.miun.se">miem2600@miun.se</a>.</p>
            <form>
                <fieldset>
                    <legend>Kontaktformulär</legend>
                    <label for="name">Namn:</label>
                    <input type="text" id="name" name="name" placeholder="Ditt namn" required>
                    <br>
                    <label for="email">E-post:</label>
                    <input type="email" id="email" name="email" placeholder="miem2600@student.miun.se" required>
                    <br>
                    <label for="message">Meddelande:</label>
                    <textarea id="message" name="message" placeholder="Ditt meddelande" required></textarea>
                    <br>
                    <button type="submit">Skicka</button>
                </fieldset>
            </form>
